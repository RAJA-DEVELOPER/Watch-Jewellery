<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Page not found — Maison Lumière. Return to our luxury watch and jewellery showroom.">
  <title>404 — Page Not Found | Maison Lumière</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: var(--obsidian);
    }
    .error-page__bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(18,60,58,0.4) 0%, rgba(10,10,10,0.95) 70%);
      z-index: 0;
    }
    .error-page__number {
      font-family: var(--font-display);
      font-size: clamp(8rem, 25vw, 18rem);
      font-weight: 700;
      line-height: 0.85;
      background: linear-gradient(135deg, rgba(232,211,162,0.08) 0%, rgba(232,211,162,0.25) 50%, rgba(232,211,162,0.06) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
      letter-spacing: -0.05em;
    }
    .error-page__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
    }
    .error-page__deco {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(232,211,162,0.06);
      pointer-events: none;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <main id="main-content">
    <div class="error-page" role="main" aria-labelledby="error-title">
      <div class="error-page__bg" aria-hidden="true"></div>

      <!-- Decorative circles -->
      <div class="error-page__deco" style="width:600px;height:600px;top:50%;left:50%;transform:translate(-50%,-50%)" aria-hidden="true"></div>
      <div class="error-page__deco" style="width:900px;height:900px;top:50%;left:50%;transform:translate(-50%,-50%)" aria-hidden="true"></div>
      <div class="error-page__deco" style="width:1200px;height:1200px;top:50%;left:50%;transform:translate(-50%,-50%)" aria-hidden="true"></div>

      <div class="error-page__content">
        <!-- Logo -->
        <a href="index.html" style="font-family:var(--font-display);font-size:1.25rem;font-style:italic;color:var(--champagne);letter-spacing:0.05em;margin-bottom:1rem">Maison Lumière</a>

        <!-- 404 number -->
        <div class="error-page__number" aria-label="Error 404">404</div>

        <!-- Message -->
        <div style="margin-top:1rem">
          <h1 id="error-title" style="font-family:var(--font-display);font-size:clamp(1.5rem,4vw,2.5rem);color:var(--ivory);font-style:italic">The Page Has Left the Dial</h1>
          <p style="color:rgba(247,243,234,0.45);font-size:1rem;line-height:1.7;max-width:480px;margin:1rem auto 0">Like a watch movement in need of service, this page seems to have stopped functioning. Allow us to guide you back to our collection.</p>
        </div>

        <!-- Actions -->
        <div class="error-links">
          <a href="index.html" class="btn btn--primary btn--lg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Return Home</span>
          </a>
          <a href="contact.html" class="btn btn--outline btn--lg"><span>Contact Us</span></a>
        </div>

        <!-- Quick links -->
        <div style="margin-top:2rem;padding-top:2rem;border-top:1px solid rgba(247,243,234,0.08);display:flex;flex-wrap:wrap;justify-content:center;gap:1.5rem">
          <a href="index.html#watches" style="font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,234,0.3);transition:color 0.2s" onmouseenter="this.style.color='var(--champagne-dark)'" onmouseleave="this.style.color=''">Watches</a>
          <a href="index.html#diamonds" style="font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,234,0.3);transition:color 0.2s" onmouseenter="this.style.color='var(--champagne-dark)'" onmouseleave="this.style.color=''">Jewellery</a>
          <a href="services.html" style="font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,234,0.3);transition:color 0.2s" onmouseenter="this.style.color='var(--champagne-dark)'" onmouseleave="this.style.color=''">Services</a>
          <a href="blog.html" style="font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,234,0.3);transition:color 0.2s" onmouseenter="this.style.color='var(--champagne-dark)'" onmouseleave="this.style.color=''">Journal</a>
          <a href="about.html" style="font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,234,0.3);transition:color 0.2s" onmouseenter="this.style.color='var(--champagne-dark)'" onmouseleave="this.style.color=''">About</a>
          <a href="sitemap.html" style="font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,234,0.3);transition:color 0.2s" onmouseenter="this.style.color='var(--champagne-dark)'" onmouseleave="this.style.color=''">Sitemap</a>
        </div>

        <p style="margin-top:2.5rem;font-size:0.7rem;color:rgba(247,243,234,0.2)">© 2026 Maison Lumière</p>
      </div>
    </div>
  </main>

  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>
  <div class="toast-container" aria-live="polite"></div>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/animations.js" defer></script>
</body>
</html>
